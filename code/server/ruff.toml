# 静态检查配置：只守住"会咬人"的规则，风格类不强制
# （经验：警告一多就没人看了 —— 本项目曾被编辑器报过 111 条，全是风格噪音）

line-length = 100

[lint]
# F = 真错误（未定义名字 / 未使用的导入）
# I = 导入顺序    UP = 过时写法
select = ["F", "I", "UP"]

# 有意不启用的规则（写在这里，免得后人以为是疏漏）：
#   BLE001 / S110    宽 except / except-pass —— 本项目到处是"任何情况都返回 JSON"的兜底：
#                    ESP32 收到 HTML 500 会报 InvalidInput，所以宁可吞异常也要回 JSON。
#   SIM102 / FURB167 风格类，收益低
#   E501             行长不强制（关键处已手工折行）